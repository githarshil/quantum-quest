<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cutting mat green gradient -->
    <linearGradient id="matGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a5247"/>
      <stop offset="50%" stop-color="#073b32"/>
      <stop offset="100%" stop-color="#042620"/>
    </linearGradient>

    <!-- Cutting mat subtle grid pattern for authentic feel -->
    <pattern id="matGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Quantum cyan glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer container soft drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Mat Badge -->
  <rect 
    x="6" 
    y="6" 
    width="116" 
    height="116" 
    rx="28" 
    fill="url(#matGradient)" 
    stroke="#166557" 
    stroke-width="2.5"
    filter="url(#softShadow)"
  />

  <!-- Subtle Mat Grid Overlay within clipped badge -->
  <rect 
    x="6" 
    y="6" 
    width="116" 
    height="116" 
    rx="28" 
    fill="url(#matGrid)" 
  />

  <!-- Inner subtle border highlight -->
  <rect 
    x="8.5" 
    y="8.5" 
    width="111" 
    height="111" 
    rx="25.5" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.12)" 
    stroke-width="1"
  />

  <!-- Quantum Atom Symbol Group (Rotated Orbits + Nucleus) -->
  <g filter="url(#cyanGlow)">
    <!-- Orbit 1: Rotated -45 degrees -->
    <ellipse 
      cx="64" 
      cy="64" 
      rx="38" 
      ry="17.5" 
      transform="rotate(-45 64 64)" 
      fill="none" 
      stroke="#00e5ff" 
      stroke-width="7.5" 
      stroke-linecap="round"
    />

    <!-- Orbit 2: Rotated +45 degrees -->
    <ellipse 
      cx="64" 
      cy="64" 
      rx="38" 
      ry="17.5" 
      transform="rotate(45 64 64)" 
      fill="none" 
      stroke="#00e5ff" 
      stroke-width="7.5" 
      stroke-linecap="round"
    />

    <!-- Quantum State Nucleus Center Dot -->
    <circle 
      cx="64" 
      cy="64" 
      r="7.5" 
      fill="#00e5ff" 
    />
  </g>
</svg>